[package]
name = "glm"
version = "0.1.0"
edition = "2021"
description = "Run Claude Code against Z.ai / Zhipu GLM models"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json", "tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[dev-dependencies]
